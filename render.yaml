# Render Blueprint for the backend API (free tier).
# In Render: New + → Blueprint → pick this repo. Then fill in the env vars it
# prompts for (MONGO_URI, CLIENT_URL). JWT_SECRET is generated automatically.
services:
  - type: web
    name: dead-wax-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # e.g. mongodb+srv://user:pass@cluster.mongodb.net/ecommerce
      - key: CLIENT_URL
        sync: false # your GitHub Pages origin, e.g. https://motawe3a.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
